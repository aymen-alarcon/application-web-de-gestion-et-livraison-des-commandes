<!DOCTYPE html>
<html lang="en" class="dark">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DeliveryAdmin — Edit Order Products</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet" />

    <style>
        /* ====== Base ====== */
        :root {
            --primary: #137fec;
            --bg-light: #f6f7f8;
            --bg-dark: #101922;
            --surface-dark: #1c242f;
            --border-dark: #2d3748;
            --text: #0f172a;
        }

        html,
        body {
            margin: 0;
            font-family: Inter, system-ui, sans-serif
        }

        body {
            background: var(--bg-light);
            color: var(--text)
        }

        .dark body {
            background: var(--bg-dark);
            color: #fff
        }

        /* ====== Card / table ====== */
        .card {
            border: 1px solid #e5e7eb;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, .04);
            overflow: hidden;
        }

        .dark .card {
            background: var(--surface-dark);
            border-color: var(--border-dark)
        }

        .table-wrap {
            overflow-x: auto
        }

        table {
            width: 100%;
            border-collapse: collapse
        }

        th {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: .05em;
            text-transform: uppercase;
            padding: 14px;
            color: #6b7280;
            background: #f9fafb;
            border-bottom: 1px solid #e5e7eb;
        }

        .dark th {
            background: #161d27;
            border-color: var(--border-dark);
            color: #94a3b8
        }

        td {
            padding: 14px;
            vertical-align: top;
            border-bottom: 1px solid #e5e7eb
        }

        .dark td {
            border-color: var(--border-dark)
        }

        tr:hover {
            background: #f9fafb
        }

        .dark tr:hover {
            background: #0f1620
        }

        /* ====== Inputs ====== */
        .input,
        .textarea {
            width: 100%;
            padding: 6px 8px;
            border: 1px solid transparent;
            border-radius: 6px;
            background: transparent;
            font-size: 14px;
        }

        .input:hover,
        .textarea:hover {
            border-color: #d1d5db
        }

        .input:focus,
        .textarea:focus {
            border-color: var(--primary);
            outline: none
        }

        .dark .input:hover,
        .dark .textarea:hover {
            border-color: #4b5563
        }

        .dark .input:focus,
        .dark .textarea:focus {
            border-color: var(--primary)
        }

        .textarea {
            resize: none;
            color: #6b7280
        }

        .dark .textarea {
            color: #94a3b8
        }

        .price-wrap {
            position: relative
        }

        .price-wrap span {
            position: absolute;
            left: 8px;
            top: 7px;
            font-size: 13px;
            color: #9ca3af
        }

        .unit-price {
            padding-left: 18px;
            text-align: right
        }

        /* ====== Qty control ====== */
        .qty-box {
            display: flex;
            align-items: center;
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            background: #fff;
            width: fit-content;
            overflow: hidden
        }

        .dark .qty-box {
            background: #0f1620;
            border-color: var(--border-dark)
        }

        .qty-btn {
            padding: 4px 8px;
            border: none;
            background: none;
            cursor: pointer;
            color: #6b7280
        }

        .qty {
            width: 36px;
            text-align: center;
            border: none;
            background: transparent;
            font-weight: 600
        }

        .qty:focus {
            outline: none
        }

        /* ====== Subtotal ====== */
        .subtotal {
            font-weight: 700;
            font-size: 14px;
            text-align: right;
            display: block
        }

        /* ====== Delete btn ====== */
        .delete-row {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            background: none;
            color: #9ca3af;
            cursor: pointer
        }

        .delete-row:hover {
            background: #fee2e2;
            color: #dc2626
        }

        .dark .delete-row:hover {
            background: rgba(185, 28, 28, .15)
        }

        /* ====== Footer / totals ====== */
        .footer {
            display: flex;
            gap: 16px;
            justify-content: space-between;
            padding: 14px;
            border-top: 1px solid #e5e7eb;
            background: #f9fafb
        }

        .dark .footer {
            background: #161d27;
            border-color: var(--border-dark)
        }

        .add-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 14px;
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            background: #fff;
            font-size: 14px;
            font-weight: 500;
            color: #374151;
            cursor: pointer
        }

        .add-btn:hover {
            background: #f3f4f6
        }

        .dark .add-btn {
            background: var(--surface-dark);
            border-color: var(--border-dark);
            color: #cbd5e1
        }

        .dark .add-btn:hover {
            background: #2d3642
        }

        .total-label {
            font-size: 13px;
            color: #6b7280
        }

        .dark .total-label {
            color: #94a3b8
        }

        #orderTotal {
            font-size: 22px;
            font-weight: 900
        }

        /* ====== Save bar ====== */
        .save-bar {
            margin-top: 18px;
            display: flex;
            justify-content: end
        }

        .save-btn {
            padding: 10px 16px;
            border-radius: 10px;
            background: var(--primary);
            color: #fff;
            border: none;
            font-weight: 600;
            cursor: pointer
        }

        .save-btn:hover {
            opacity: .9
        }

        /* ====== Image thumbnail ====== */
        .thumb {
            width: 48px;
            height: 48px;
            border-radius: 10px;
            background-size: cover;
            background-position: center;
            border: 1px solid #e5e7eb
        }

        .dark .thumb {
            border-color: var(--border-dark)
        }
    </style>
</head>

<body>

    <div class="card" style="max-width:1200px;margin:40px auto;padding:0">
        <div class="table-wrap">
            <table id="productsTable">
                <thead>
                    <tr>
                        <th>Image</th>
                        <th>Product Name</th>
                        <th>Description</th>
                        <th>Unit Price</th>
                        <th>Qty</th>
                        <th style="text-align:right">Subtotal</th>
                        <th></th>
                    </tr>
                </thead>

                <tbody>

                    <!-- Example Row -->
                    <tr>
                        <td>
                            <div class="thumb" style='background-image:url("https://picsum.photos/80")'></div>
                        </td>

                        <td><input class="input product-name" value="Sample Product" /></td>

                        <td><textarea class="textarea" rows="1">Short description</textarea></td>

                        <td>
                            <div class="price-wrap">
                                <span>$</span>
                                <input class="input unit-price" type="number" value="10.00" step="0.01" />
                            </div>
                        </td>

                        <td>
                            <div class="qty-box">
                                <button class="qty-btn qty-minus"><span
                                        class="material-symbols-outlined">remove</span></button>
                                <input class="qty" type="number" value="1" />
                                <button class="qty-btn qty-plus"><span
                                        class="material-symbols-outlined">add</span></button>
                            </div>
                        </td>

                        <td><span class="subtotal">$10.00</span></td>

                        <td><button class="delete-row"><span class="material-symbols-outlined">delete</span></button>
                        </td>
                    </tr>

                </tbody>
            </table>
        </div>

        <div class="footer">
            <button id="addProductBtn" class="add-btn">
                <span class="material-symbols-outlined">add</span> Add Product
            </button>

            <div style="text-align:right">
                <div class="total-label">Order Total</div>
                <div id="orderTotal">$10.00</div>
            </div>
        </div>
    </div>

    <div class="save-bar">
        <button class="save-btn">Save Changes</button>
    </div>

    <script>
        function format(n) { return "$" + n.toFixed(2) }

        function recalcRow(row) {
            const price = parseFloat(row.querySelector(".unit-price").value) || 0
            const qty = parseInt(row.querySelector(".qty").value) || 0
            row.querySelector(".subtotal").textContent = format(price * qty)
            recalcTotal()
        }

        function recalcTotal() {
            let t = 0
            document.querySelectorAll(".subtotal").forEach(s => {
                t += parseFloat(s.textContent.replace("$", "")) || 0
            })
            document.getElementById("orderTotal").textContent = format(t)
        }

        document.getElementById("productsTable").addEventListener("click", e => {
            const row = e.target.closest("tr"); if (!row) return

            if (e.target.closest(".qty-plus")) {
                const q = row.querySelector(".qty"); q.value = Math.max(1, (+q.value || 0) + 1); recalcRow(row)
            }

            if (e.target.closest(".qty-minus")) {
                const q = row.querySelector(".qty"); q.value = Math.max(1, (+q.value || 0) - 1); recalcRow(row)
            }

            if (e.target.closest(".delete-row")) {
                row.remove(); recalcTotal()
            }
        })

        document.getElementById("productsTable").addEventListener("input", e => {
            const row = e.target.closest("tr")
            if (row && (e.target.classList.contains("unit-price") || e.target.classList.contains("qty")))
                recalcRow(row)
        })

        document.getElementById("addProductBtn").addEventListener("click", () => {
            const tbody = document.querySelector("#productsTable tbody")
            const clone = tbody.lastElementChild.cloneNode(true)
            clone.querySelector(".product-name").value = "New Product"
            clone.querySelector(".textarea").value = "Description"
            clone.querySelector(".unit-price").value = "0.00"
            clone.querySelector(".qty").value = "1"
            clone.querySelector(".subtotal").textContent = "$0.00"
            tbody.appendChild(clone)
            recalcTotal()
        })

        recalcTotal()
    </script>

</body>

</html>
